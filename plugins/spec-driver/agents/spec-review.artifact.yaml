# spec-review 子代理制品 Schema
# F286：报告同时落盘（子代理获得仅限该文件的 Write 权限）并通过返回消息传递；此前"不生成文件"与 SKILL 要求
# 产出 verification/spec-review-report.md 的任务契约不匹配（F279 反馈），完整审查会随会话流失。
output_path: "{feature_dir}/verification/spec-review-report.md"
required_sections:
  - "## Spec 合规审查报告"
  - "### 逐条 FR 状态"
  - "### 总体合规率"
  - "### 偏差清单"
  # 章节名随「过度实现」重映射为独立观察项而改写（原名 "### 过度实现检测"）；
  # 与 agents/spec-review.md 的输出模板同批改，改一处不改另一处即 artifact 合同断裂。
  - "### 超范围实现观察"
  - "### 问题分级汇总"
  # γ-C3 (a) 的落点：类别列取值抽检是「约束型」四重免检通道上的唯一独立笔
  # （plan 自填类别、verify 被禁静默改判），本节缺席即该抽检无产物落点。
  - "### 类别列取值抽检"
optional_sections:
  # 无——所有章节均为返回消息必填
