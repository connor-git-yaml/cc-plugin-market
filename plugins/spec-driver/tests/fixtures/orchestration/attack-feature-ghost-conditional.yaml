# 攻击 fixture（Feature 277 · Phase A 对抗修订 · α-C1「幽灵门位 · conditional 恒假」）
#
# 构造：modes.feature 整段替换——把 17 个 phase 里全部 gates_before / gates_after 中的
# GATE_DESIGN / GATE_TASKS 摘掉，再在序列最前插一个挂着两道门、但 conditional 恒假的
# 幽灵 phase（上下文里没有 never_true_flag 变量 ⇒ evaluateCondition 恒返回 false ⇒
# shouldExecutePhase 判该 phase 不执行 ⇒ 其 gates_after 一次都不被求值）。
# 全程不碰 gates: 块。
#
# 修订前的实测（三道防线同时失明）：
#   get-gate-behavior feature GATE_DESIGN → mounted: true / mounted_in_base: true
#   effective-orchestration feature       → diagnostics = [info: mode-overridden]
#   validate-gate-mounting                → status = pass（12 条断言全绿）
# 修订后：resolver 判 suppressor-added + missing-anchor ⇒ error: gate-mounting-lost ⇒ 回退 base。
