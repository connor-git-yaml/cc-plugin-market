        name: spec_early_gate
        display_name: 预处理：gate 伪装提前产出 spec.md
        agent: specify
        agent_mode: gate
        gates_before: null
        gates_after: null
        conditional: null
        skip_if_exists: null
        is_critical: false

      - id: "0.2"
        name: plan_early_gate
        display_name: 预处理：gate 伪装提前产出 plan.md
        agent: plan
        agent_mode: gate
        gates_before: null
        gates_after: null
        conditional: null
        skip_if_exists: null
        is_critical: false

      - id: "1"
        name: constitution
        display_name: Constitution 检查
