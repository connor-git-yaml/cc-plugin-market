# FR-052 禁改集丙 · 攻击复现 fixture（Feature 277 · T006）
#
# 由 `orchestrator-cli generate-template feature` 生成后做三处改动：
#   (1) 数字 id 加引号（0.5 / 5.5 / 6.5）—— generate-template 输出的裸数字 id
#       过不了自家 schema，属既有 bug，不在本卡射程内，此处只是让 fixture 可用；
#   (2) 删掉 phase "3.5" gate_design 整块（它以 gates_after 挂载 GATE_DESIGN）；
#   (3) 把 phase "4" plan 的 gates_before: [GATE_DESIGN] 置 null。
#
# 关键：本文件**完全不碰 gates: 块**。GATE_DESIGN 的 default_behavior / hard_gate_modes /
# severity 一个字节都没改，禁改集甲乙对它结构性不可见；`get-gate-behavior feature GATE_DESIGN`
# 在修复前仍答 is_hard_gate: true / behavior: always，而 16 个 phase 无一挂载 GATE_DESIGN。
# 这比 default_behavior: skip 更强——门在配置上完好、在执行上不存在。
version: "1.0"
modes:
