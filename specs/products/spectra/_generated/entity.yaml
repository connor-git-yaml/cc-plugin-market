description: "Spectra v4.6.0（M10 批次 3：诚实图与换证据源的门禁）— (1) panoramic-query 引擎缓存按 mtime+size 失效并接 F266 诚实 envelope（F280）；(2) 采集面 SSoT 收编忽略目录 + 护栏比较器补边属性/节点顶层/hyperedges 三维（F284）；(3) G0-4 图质量尺子 normalizeName 支持 Class.method（F282）；(4) F213 e2e 真实家目录隔离（F281）。v4.5.0（可信活图链与 Codex 运行时治理）— 图事实源与门禁收敛：(1) 实例方法调用边解析补齐（F260，method 类调用边覆盖率 29.5%→45.6%）；(2) `.mjs`/`.cjs`（F243）与 `.pyi`（F250）纳入采集面，四处扩展名脱节收口；(3) collector 指纹参与 freshness 判定（F249），指纹不一致判 stale 而非误判 fresh；(4) 图产物 builder build stamp（F261，只可见不判定）；(5) 空图/退化图 fail-loud 与 MCP 诚实返回面（F266）。v4.3.0（Feature 186 分发可靠性）— npm 重发 + 防漂移门禁：(1) Codex wrapper body sha256 指纹校验（生成端/校验端共用单一 Node helper，缺 sha 即 fail，挡 source 漂移与手改）；(2) spectra --version 输出 build commit 后缀（复用 F176 盖章，区分新旧 binary）；(3) prepare MCP 工具 ESM 死代码修复（裸 require→静态 import，detectedLanguages 真实注入）；(4) agent-context 3 处错误响应脱敏（不外漏绝对路径/stack）；(5) batch --help synopsis 补 graph-only 并加定点断言护栏。汇总自 F175-F196 修复链。v4.2.0（Feature 170a）— NPM 发布同步：包含 Feature 155 agent-context MCP tools（impact / context / detect_changes）。修复 npm publish 滞后导致全局安装 binary 缺工具的 Bug-1。v4.1.1（Feature 146）— LLM 并发优化器：默认并发 1→3（Sonnet 单请求 15-30s，大项目总耗时降 ~60-65%）+ p-limit ^6.1.0 替换手写信号量（移除 ~30 行含 H2 死锁补丁的实现）+ 三级配置链 BatchOptions.concurrency > SPECTRA_CONCURRENCY env > 默认 3。v4.1.0 — Python AST 函数级 Graph + Phase 2 Bug 修复（Feature 143）"
