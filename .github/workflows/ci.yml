name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0（Feature 265 G0-2）——默认是浅克隆（depth 1），而 release:check 的
      # 发布断层判据要拿 npm registry 的 gitHead（几十到上百个 commit 之前的历史提交）在本地
      # 做 `git cat-file -e` + `git rev-list --count`。浅克隆下该 commit 恒不可达，判据会
      # 永远只输出 indeterminate，整条 G0-2 在 CI 上形同虚设。这不是可选优化。
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npm run lint

      - name: Build
        id: build
        run: npm run build

      # 干净 checkout 没有 specs/_meta/graph.json（该路径被 .gitignore 忽略），
      # 而 graph-quality / spec-drift 相关测试硬依赖它存在，缺图即红。
      # graph-only 模式是纯 AST 构建：零 LLM 调用、零认证需求、约 5s 完成。
      # 必须排在 Build 之后（依赖 dist/cli/index.js）、Test 之前。
      - name: Build Knowledge Graph
        id: graph
        run: node dist/cli/index.js batch --mode graph-only

      # F269：CI 上把 vitest 并发钉死到 1 个 fork（步级 env，仅此步生效）。
      #
      # vitest.config.ts 的 F235 注释已记录：worker↔主进程的 birpc RPC
      # （onTaskUpdate 等）有 60s 硬超时，且该超时 vitest 未开放配置（上游
      # #8164 open）。F235 把 CI worker 降到 CPU/2（4 vCPU → 2 个）后，其
      # implement 报告估计仅剩约 1.2× 安全余量（该倍数在 F235 verification
      # 中被标注为未经独立验证的预测值）；此后测试面继续增长（tests 累计
      # 时长从 527 文件时代的 ~601s 涨到 533 文件时代的 ~810-836s，+35%，
      # 详见 fix-report.md 确定性证据表），三次 run 逐字同签名复现，余量
      # 确证被吃穿：4 vCPU 上「主进程 + 2 worker + spawn 孙进程」饱和排队，
      # worker 的 onTaskUpdate 应答延迟越过 60s，抛出 unhandled error 让
      # 进程 exit 1，而 vitest 汇总行仍是 `0 failed`（全绿假红）。钉 1 fork
      # 只收口①类触发面——多 worker 争抢排队（run 33311237734 实证 nproc=4、
      # 1 fork 下其余静默窗口全部 <36s）；同一次 run 仍复现同签名超时，定位
      # 出②类触发面：`tests/integration/graph-quality-cli.test.ts` 的 CLI
      # helper 连续同步 spawn 累积出 64.8s 零输出静默窗口，与 worker 数无关，
      # 由该文件 helper async 化收口（T008，见其注释）。步级 env 覆盖
      # maxWorkers 推导值无需改动 npm test 组合
      # （等效替代是给 vitest 传 --maxWorkers=1 CLI flag，但那要改
      # package.json 脚本链）。poolOptions.forks.maxForks 优先级高于
      # maxWorkers，详见 vitest.config.ts 与 fix-report.md。
      - name: Test
        env:
          VITEST_MAX_FORKS: "1"
        run: |
          # 护栏：VITEST_MAX_FORKS 必须是 >=1 的整数——vitest 对 "0" 走真值
          # 分支得 maxForks=0，会静默跑零测试仍 exit 0（连 "No test files
          # found" 兜底都绕过）
          node -e 'const v=process.env.VITEST_MAX_FORKS;const n=Number(v);if(!Number.isInteger(n)||n<1){console.error("[ci-diag] VITEST_MAX_FORKS 必须是 >=1 的整数，得到: "+v);process.exit(1)}'
          echo "[ci-diag] nproc=$(nproc) VITEST_MAX_FORKS=${VITEST_MAX_FORKS}"
          # F285：此处只跑 vitest。`npm test` = `vitest run && test:plugins`，而下方「Test Plugins (mjs gate)」
          # 已用 if: always() 独立跑一遍 test:plugins——两处都跑就是 mjs 面二跑（M10 §12.3 INFO）。
          npx vitest run

      # 治理链（Feature 265 G0-2）。位置有两条约束：
      #
      # 1. 必须排在 Build Knowledge Graph **之后**：repo:check 内的 graph-quality:* 判据读
      #    specs/_meta/graph.json（该路径被 .gitignore，干净 checkout 没有）。⚠️ 缺图时它们
      #    **不会**变红——graph-quality-core 的 FR-017 是优雅跳过，缺图即静默 skip、CI 照绿
      #    （对抗审查 C-5 实测；此处原注释写的"顺序颠倒会必红"是不实陈述）。也就是说步骤顺序
      #    是这条判据真正跑起来的**唯一**保障，没有任何门禁会在顺序错时提醒你。因此下面
      #    Repo Check 的 run 首行放了一条 `test -f` 哑守卫：图不在就当场红，而不是绿着空转。
      # 2. 必须排在 Test **之后**（对抗审查 W-7）：治理检查红掉会短路整个 job，把 vitest 的
      #    全部信号一起吞掉——先拿到测试结论，再看治理结论。
      #
      # 两步都带显式 if：**不受 Test 连坐，但仍以 build + graph 成功为前提**。GitHub Actions
      # 里没写 if 的步骤默认是 `if: success()`，而上面第 2 条把治理链排到了 Test 之后——于是
      # Test 一红，治理两步直接被 skip。master 当前有 3 条硬依赖全局 spectra CLI 的 mjs 用例
      # 恒红（独立卡修），实测 run 33296411587 中 Repo Check / Release Check 双 skipped，
      # G0-2 的"CI 接治理链"在红河上等于没接。因此改判为 build + graph 两步成功即执行：测试
      # 红绿不影响治理结论，而构建或建图失败时依旧跳过（保留 C-5 的"不在一个已知损坏的构建上
      # 跑治理检查"）。这与下面 Test Plugins 用 if: always() 的理由（防 vitest flaky 短路掉
      # mjs 测试面）仍是两类不同问题，不套用同一处理。
      - name: Repo Check
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.graph.outcome == 'success' }}
        run: |
          test -f specs/_meta/graph.json
          npm run repo:check

      - name: Release Check
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.graph.outcome == 'success' }}
        run: npm run release:check

      # F272 US2：三份类型契约守护资产（F220 orchestrator exports / F222
      # llm-degraded required / F170c enrichment optional）只 type-only
      # import src/**，不依赖 dist/，此前它们从未被 CI 校验过——`npm run lint`
      # 走根 tsconfig.json（exclude 含 "tests"）覆盖不到 tests/type-tests/。
      #
      # 位置沿用与 Repo Check / Release Check 同一条 F265 原则（对抗审查
      # W-7）：治理/校验类步骤必须排在 Test **之后**——红掉会短路整个 job，
      # 把 vitest 的全部信号一起吞掉，必须先拿到测试结论。此步骤原先误排
      # 在 Build **之前**（第 5 位），F272 异构对抗审查实证：
      # tests/type-tests/tsconfig.json 开了 exactOptionalPropertyTypes:
      # true（根 tsconfig 是 false），比 `npm run lint` 严格得多——一次
      # lint/build 双绿的生产改动就能让它单独变红，进而通过 `Build` 被
      # skip 连坐吞掉 `Build Knowledge Graph` / `Test` / `Repo Check` /
      # `Release Check` 全部下游信号。既然它和 Repo Check / Release Check
      # 一样只依赖 src/**（不依赖 dist/），就应与它们并列排在 Test 之后，
      # 用同一条 if 表达式：不受 Test 连坐，但仍以 build + graph 成功为前提。
      - name: Type Check Tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.graph.outcome == 'success' }}
        run: npm run typecheck:tests

      # F285（M10 §12.3 W-1）：tests/ + scripts/*.ts 的类型门，**只报不阻断**。根 tsconfig 只 include src/，
      # 测试与脚本此前零类型覆盖；tsconfig.tests.json 沿用根严格度 + allowJs，本机实跑（2026-09-13）
      # 1022 处错误 / 147 文件（TS2532 possibly undefined 与 TS2322 为主）——这是燃尽基线，不是当下能阻断的门。
      # ⚠️ 两条实测教训：tests/fixtures/ 里刻意语法坏死的样本会让 tsc 跳过**全部**语义检查（只报 1 个语法错，
      # 假绿），故配置必须排除它；只看 `tail` 会把 1022 看成 1。continue-on-error 让步骤红着可见但不连坐。
      # 排位与上一步同理（Test 之后、不受 Test 连坐、以 build + graph 成功为前提）。
      - name: Type Check Tests (full, report-only)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.graph.outcome == 'success' }}
        continue-on-error: true
        run: |
          set +e
          npm run typecheck:tests:full > typecheck-tests-full.log 2>&1
          status=$?
          errors=$(grep -c 'error TS' typecheck-tests-full.log || true)
          files=$(grep 'error TS' typecheck-tests-full.log | sed 's/(.*//' | sort -u | wc -l | tr -d ' ')
          echo "[typecheck:tests:full] exit=$status errors=$errors files=${files}（只报不阻断；燃尽基线见 specs/285-*/fix-report.md）"
          if grep -qE 'error TS1[0-9]{3}:' typecheck-tests-full.log; then echo "::warning::typecheck:tests:full 存在语法错（TS1xxx），tsc 已跳过全部语义检查——errors=$errors 不是燃尽数（对抗复审 A-W2）"; fi
          grep -o 'error TS[0-9]*' typecheck-tests-full.log | sort | uniq -c | sort -rn | head -5
          exit $status

      # 独立门禁：plugin mjs 测试。npm test 内部用 `vitest run && npm run test:plugins`，
      # 若 vitest 因仓库预存 dist-staleness flaky 失败会短路跳过 test:plugins，
      # 导致 162 个 mjs 测试在 CI 实际不跑。此步骤无论上一步成败都独立运行并报告，
      # 确保 plugin mjs 测试始终被 gate（Feature 201 Phase B 复审修正）。
      - name: Test Plugins (mjs gate)
        if: ${{ always() }}
        run: npm run test:plugins


  # F285（M10 §12.3 W-7）：vitest.config.ts 里的覆盖率阈值（全局 80% + 六个文件 per-file 95%：F150 SC-001 四个
  # extractor / F171 SC-005 两个 file-nav 模块）此前**无任何门禁执行**——阈值写在配置里但 `--coverage` 从未在
  # CI 或发布路径上跑过。本机全量实跑（2026-09-13）All files 88.13 / 85.53 / 94.78 / 88.13，阈值全部达标，故接进 CI。
  # 独立 job 与 test 并行：阈值未达时 vitest 非零退出即红，不影响 test job 的信号；VITEST_MAX_FORKS=1 沿用 F269
  # 的 4 vCPU runner 争抢结论。图照建：缺图时依赖图的用例静默 skip，会让覆盖率与 test job 不可比。
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Build Knowledge Graph
        run: node dist/cli/index.js batch --mode graph-only
      # F292：F285 首跑实证（run 34710678418）暴露的两条负向 grep 放行判据被证伪——
      # ANSI 未剥离时它们在 CI 上结构性匹配不到彩色 failed 行（真实测试失败 + 一次 birpc
      # 超时会被一并放行），且从未正向确认「打印了通过汇总」与「覆盖率报告确实生成」。
      # 判定逻辑已抽成可单测纯函数 scripts/lib/coverage-gate-core.mjs（tests/unit/coverage-gate.test.ts
      # 8 真实样本 + 合成串隔离用例覆盖），此处只负责跑批落日志、交判定器裁决。
      # 旧的裸尾部截取窗口一并移除——它正是本次根因之一（汇总块在覆盖率表之前，固定行数
      # 窗口天然看不到，人工复核也复核不到）；判定器自己把证据摘录打印到 stdout 替代它，
      # 完整 coverage.log 改由下方 Upload coverage log 步上传，供复盘下载。
      - name: Coverage (thresholds enforced)
        env:
          VITEST_MAX_FORKS: "1"
        run: |
          set +e
          npm run test:coverage > coverage.log 2>&1
          status=$?
          node scripts/coverage-gate.mjs coverage.log "${status}"
          gate_status=$?
          exit "${gate_status}"

      - name: Upload coverage log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-log
          path: coverage.log
          retention-days: 7
